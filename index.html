<body>
    <main class="wrap">
        <img class="icon" src="assets/icon.png" width="96" height="96" alt="Checkers · Draughts · Damas">
        <h1>Checkers · Draughts · Damas</h1>
        <p class="sub">Choose your language</p>
        <nav aria-label="Language" style="display:block">
        <a class="btn astore" href="install_en.html" lang="en" hreflang="en">English</a>
        <a class="btn astore" href="install_vi.html" lang="vi" hreflang="vi">Tiếng Việt</a>
        <a class="btn astore" href="install_es.html" lang="es" hreflang="es">Español</a>
        <a class="btn astore" href="install_pt.html" lang="pt" hreflang="pt">Português</a>

        </nav>
    </main>
    <script>
    (function () {
        'use strict';
        var supported = ["en", "vi", "es", "pt", "tr"];
        var preferred = navigator.languages && navigator.languages.length
            ? navigator.languages : [navigator.language || 'en'];
        var selected = 'en';
        for (var i = 0; i < preferred.length; i++) {
            var code = preferred[i].toLowerCase().split(/[-_]/)[0];
            if (supported.indexOf(code) !== -1) {
                selected = code;
                break;
            }
        }
        window.location.replace('install_' + selected + '.html');
    }());
    </script>
